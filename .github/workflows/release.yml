# Pushing a tag like v1.2.0 builds ccs for macOS and Linux and publishes the
# archives as a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*} arch=${target#*/}
            dir="ccs_${os}_${arch}"
            mkdir -p "dist/$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/$dir/ccs" .
            cp LICENSE README.md "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes
